<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transazioni | Lipari Bank</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/utils.js" defer></script>
  <script src="js/transactions.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="panel">
      <div class="page-heading">
        <div>
          <p class="eyebrow">Lipari Bank</p>
          <h1>Le tue transazioni</h1>
        </div>
        <a class="text-link" href="login.html">Esci</a>
      </div>
      <div class="filters" aria-label="Filtri transazioni">
        <label>Tipo
          <select id="typeFilter">
            <option value="all">Tutte</option>
            <option value="credit">Entrate</option>
            <option value="debit">Uscite</option>
          </select>
        </label>
        <label>Importo minimo
          <input id="minimumAmount" type="number" min="0" step="0.01" placeholder="0">
        </label>
        <label>Ordina per
          <select id="sortSelect">
            <option value="date-desc">Data: piu recenti</option>
            <option value="date-asc">Data: piu vecchie</option>
            <option value="amount-desc">Importo: maggiore</option>
            <option value="amount-asc">Importo: minore</option>
          </select>
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Data</th>
              <th>Descrizione</th>
              <th>Tipo</th>
              <th>Importo</th>
            </tr>
          </thead>
          <tbody id="transactionsBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
