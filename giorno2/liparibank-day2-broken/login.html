<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi — LipariBank</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-card__logo">
        <div class="login-card__logo-text">Lipari<span>Bank</span></div>
      </div>

      <h1 class="login-card__title">Bentornato</h1>
      <p class="login-card__subtitle">Accedi al tuo conto personale</p>

      <div id="error-message" role="alert"></div>

      <form id="login-form" novalidate>

        <div class="form-group">
          <label for="username">Codice cliente</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="mario.rossi"
            autocomplete="username"
            required
          >
          <div class="form-hint">Usa <strong>mario.rossi</strong> per il test</div>
        </div>

        <div class="form-group">
          <label for="password">
            Password
            <a href="#" style="float:right; font-size:12px; color:#2d7dd2; font-weight:400; text-decoration:none;">
              Password dimenticata?
            </a>
          </label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
          <div class="form-hint">Usa <strong>password123</strong> per il test</div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn--primary btn--full btn--lg">
          Accedi
        </button>

      </form>

      <div class="login-card__footer">
        Non hai un conto? <a href="#">Aprilo gratuitamente</a>
      </div>

    </div>
  </div>

  <script src="js/login.js"></script>

</body>
</html>
