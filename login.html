<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Lipari Bank</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/login.js" defer></script>
</head>
<body>
  <main class="page-shell page-shell--narrow">
    <section class="panel">
      <p class="eyebrow">Lipari Bank</p>
      <h1>Accedi al tuo conto</h1>
      <p class="intro">Inserisci le tue credenziali per continuare.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email">
          <p id="emailError" class="field-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
          <div class="password-strength" aria-live="polite">Inserisci una password</div>
          <p id="passwordError" class="field-error" aria-live="polite"></p>
        </div>
        <button type="submit">Accedi</button>
      </form>
    </section>
  </main>
</body>
</html>
